# ezconf-web configuration
# Copy to ezconf.toml and edit as needed.
# Command-line arguments always override values set here.

# Path to the NixOS configuration JSON file to edit (required). Can also be a directory of
# *.json files (each an independent tab, merged together at Nix-eval time); when it is, the
# preferred initial tab can be set with default_file below.
file = "example/configuration.json"
# default_file = "configuration.json"

# Directory to serve static files from (default: ./webroot)
# webroot = "webroot"

# Authentication mode: auto, custom, pam
#   auto    — PAM if available, else custom (default)
#   custom  — username/password defined below
#   pam     — system username + password via PAM
# auth = "auto"

# Custom login credentials (required for auth = "custom")
# username = "admin"
# password = "changeme"

# UI theme: nixos, dark, light (default: nixos)
# theme = "nixos"

# Set to "install" to show buttons with mode = "install" (see [[buttons]] below) in their own
# row and grey out ordinary buttons, from page load. Deploy-time only, not a runtime toggle --
# meant for a dedicated install image, not something to flip on an already-running instance.
# mode = "install"

# Port the terminal.py WebSocket service is running on (enables terminal panel)
# terminal_port = 9091

# Shell to launch in the terminal panel (default: login shell or $SHELL)
# shell = "/bin/bash"

# Name of a tmux session. When set, the terminal attaches to a persistent tmux session there
# instead of forking a fresh shell per connection, so a running command survives terminal.py
# restarting or a reconnect -- rather than dying with the connection. A (re)connecting client
# also gets the session's recent tmux scrollback replayed, so it doesn't miss what happened
# while disconnected. Requires tmux to be installed. Something needs to actually create the
# session and apply its settings first (the NixOS module does this via
# ezconf-terminal-session.service + ezconf-terminal-configure.service) -- terminal.py's normal
# WebSocket server just attaches to whatever's already there:
#   tmux new-session -d -s ezconf
#   terminal.py --config ezconf.toml --configure-session
# tmux_session = "ezconf"

# Path to ezconf-mkoptions binary. When set, enables the "↻ Autocomplete"
# button in the GUI to regenerate autocomplete data on demand.
# mkoptions = "/path/to/ezconf-mkoptions"

# Flake path passed as TARGET to mkoptions (default: /etc/nixos); also the tree "Export system"
# zips up in the GUI
# nixos_target = "/etc/nixos"

# Whether "Export system" skips dotfiles/dotdirs (.git, .ssh, age/sops keys, etc.) (default: true)
# system_export_exclude_dotfiles = true

# Basenames "Export system" always skips, anywhere in the tree (default: just
# hardware-configuration.nix, since it's machine-specific and shouldn't be bundled into a config
# meant to be reused elsewhere)
# system_export_exclude = ["hardware-configuration.nix"]

# Directory to serve /autocomplete/ from (overrides WEBROOT/autocomplete/)
# autocomplete_dir = "/var/lib/ezconf/autocomplete"

# File to persist the session key across service restarts
# session_key_file = "/run/ezconf/session.key"

# Directory to store configuration.json backups (default: <config dir>/.ezconf-backups)
# backup_dir = "/var/lib/ezconf/backups"

# Number of backups to keep on each save; 0 disables backups (default: 5)
# backup_count = 5

# IP address to listen on (default: 127.0.0.1; use 0.0.0.0 for all interfaces)
# listen = "127.0.0.1"

# Hostnames trusted for CSRF check — required when behind a reverse proxy such as nginx.
# Add every public hostname nginx uses for this server.
# trusted_hosts = ["myserver.example.com"]
#
# "*" disables the check entirely, accepting any Host header — use this when the reachable
# address can't be known ahead of time (e.g. an installer ISO getting a DHCP lease). Only do
# this if you're not worried about a browser on the same network visiting a malicious page,
# since it's what protects against DNS-rebinding attacks.
# trusted_hosts = ["*"]

# TLS certificate and key (leave commented out for plain HTTP)
# cert = "localhost.pem"
# key  = "localhost-key.pem"

# Restrict logins to these users (PAM mode only).
# Defaults to the user who started the server if not set.
# allowed_users = ["alice", "bob"]

# [ports]
# web = 9090

# Buttons shown in the terminal panel, regardless of which config file (tab) is open — in
# addition to any services.ezconf.buttons set inside a config file itself. Requires terminal_port.
# [[buttons]]
# label = "Rebuild"
# command = "nixos-rebuild switch --flake /etc/nixos"
# save_first = true
# clear_first = true
#
# [[buttons]]
# label = "Update"
# command = "nix flake update /etc/nixos"
#
# Give several buttons the same menu name to group them into one dropdown instead of each
# getting its own slot in the bar.
# [[buttons]]
# label = "Test"
# command = "nixos-rebuild test --flake /etc/nixos"
# save_first = true
# menu = "Deploy"
#
# mode = "install" keeps a button in a second row that only shows up (and greys out the ordinary
# buttons) when top-level mode = "install" above -- for shortcuts that are only relevant, and only
# safe to have visible, during an install.
# [[buttons]]
# label = "Wipe disk and reinstall"
# command = "disko-install --flake /etc/nixos"
# mode = "install"
